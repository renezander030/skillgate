name: Release

# Tag-driven release: push a SemVer tag (e.g. v0.4.0) to publish.
#   npm version patch|minor|major   # bumps package.json + creates the tag
#   git push --follow-tags
# Publishes through npm trusted publishing (GitHub OIDC): no npm token.
on:
  # Proof only, no publish: npm trusts this workflow file whatever its trigger, so a manual run exchanges the
  # job's OIDC token per package and says which package npm would refuse (.github/scripts/npm-trust-proof.mjs).
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  npm-trust-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the OIDC token npm exchanges; nothing is published
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Exchange the OIDC token with npm for every public package
        run: node .github/scripts/npm-trust-proof.mjs --out npm-trust-proof.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-trust-proof
          path: npm-trust-proof.json

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write    # npm provenance (--provenance)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Fail early if the tag doesn't match the version in package.json.
      - name: Verify tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != package.json ${PKG}" >&2
            exit 1
          fi

      - name: Extract this version's changelog section
        run: node .github/scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > RELEASE_NOTES.md

      - name: npm 11 for trusted publishing
        run: npm install -g npm@11.12.1

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
